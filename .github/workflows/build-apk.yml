name: Build Kelola APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Extract zip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ada file .zip ditemukan di root repo!"
            exit 1
          fi
          echo "Mengekstrak: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          GRADLE_DIR=$(dirname "$(find extracted -name 'settings.gradle.kts' | head -n 1)")
          if [ -z "$GRADLE_DIR" ] || [ "$GRADLE_DIR" = "." ]; then
            echo "settings.gradle.kts tidak ditemukan di dalam zip!"
            exit 1
          fi
          echo "Project Gradle ditemukan di: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelola-debug-apk
          path: ${{ env.GRADLE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
